name: upstream-schedule
# Starts the daily upstream check (upstream-watch) on develop.
#
# GitHub only runs scheduled workflows from the default branch (main), and main has to stay the stable
# branch that users install from. So this small trigger lives on main and does one thing: start
# upstream-watch on develop. That run uses develop's copy of the workflow and scripts, so changes to the
# check take effect as soon as they merge into develop. Only this trigger needs a release to change.
on:
  schedule:
    - cron: '0 6 * * *'   # every day, 06:00 UTC
  workflow_dispatch:
permissions:
  actions: write          # to start another workflow; GITHUB_TOKEN may trigger workflow_dispatch runs
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start upstream-watch on develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run upstream-watch.yml --repo "$GITHUB_REPOSITORY" --ref develop
          echo "Started upstream-watch on develop. Its run is listed under the upstream-watch workflow."
