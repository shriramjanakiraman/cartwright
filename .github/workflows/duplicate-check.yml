name: duplicate-check
# Is a new or changed skill a repeat of one that already exists? (see GOVERNANCE.md)
# Compares each skill added or changed in the pull request with core and the official skills, offline
# (scripts/similar-skills.mjs). Each likely repeat gets a comment on the skill's file with a suggestion, and
# the pull request gets "Request changes". The check fails until every such comment is resolved; then the
# review is dismissed. Resolving doesn't start a run by itself: reply to the comment (duplicate-recheck
# then re-runs this check, so there is only ever one "duplicates" result) or re-run it by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: duplicate-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  duplicates:   # required status check name used by scripts/protect-branches.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Find likely repeats among the skills this pull request adds or changes
        # The checkout is the pull request's merge commit, so its first parent is the target branch and the
        # diff between them is exactly what the pull request changes.
        run: |
          node scripts/similar-skills.mjs --base HEAD^1 --json > findings.json || true
          echo "Likely repeats: $(node -p "require('./findings.json').length")"
      - name: Comment, request changes, and pass only when every comment is resolved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/duplicate-review.mjs findings.json
