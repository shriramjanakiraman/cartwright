name: release
# Merging a release pull request into main publishes the release: tag vX.Y.Z from package.json and
# release notes from the matching CHANGELOG section. Users then receive it through the plugin and link.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag and publish if this version isn't released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "v$V already released; nothing to do."; exit 0; fi
          awk -v v="$V" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file notes.md
