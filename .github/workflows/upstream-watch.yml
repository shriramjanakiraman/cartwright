name: upstream-watch
# Door A: when an official publisher ships a change, raise a pull request into develop for review.
# Runs daily from develop: upstream-schedule (on main) starts it there every day at 06:00 UTC, because
# GitHub only runs schedules from the default branch. It always runs develop's copy of this file and the
# scripts, so changes here take effect once they merge into develop. To run it by hand:
#   gh workflow run upstream-watch.yml --ref develop
# It keeps ONE standing branch and pull request (feature/upstream-updates): each run that finds changes
# refreshes them, so unmerged updates never pile up as a pull request per day.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-watch
  cancel-in-progress: false
env:
  BRANCH: feature/upstream-updates
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Only run from develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::upstream-watch runs from develop only. Start it with: gh workflow run upstream-watch.yml --ref develop"
          exit 1
      - uses: actions/checkout@v4
        with: { ref: develop, fetch-depth: 0 }   # upstream changes are tested on develop like everything else
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Compare upstream.lock.json with official sources
        id: up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/upstream-check.mjs --write --report upstream-report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Mirror, rebuild and run the same checks as CI
        if: steps.up.outputs.code == '10'
        # Pull requests opened by this workflow don't trigger other workflows automatically, so the
        # update is checked here before it's proposed.
        run: |
          node scripts/sync-upstream.mjs
          node scripts/build.mjs
          node scripts/validate.mjs
          node scripts/scrub-scan.mjs
          node scripts/sync-upstream.mjs --check
          node scripts/build.mjs --check
          # New or changed official skills that may repeat one of ours (scripts/similar-skills.mjs).
          CHANGED=$( { git ls-files --others --exclude-standard -- upstream; git diff --name-only -- upstream; } | grep '/SKILL.md$' || true)
          OVERLAPS=$( [ -n "$CHANGED" ] && node scripts/similar-skills.mjs --markdown $CHANGED || true)
          [ -z "$OVERLAPS" ] || printf '\n## Possible overlaps with our skills\n\n%s\n' "$OVERLAPS" >> upstream-report.md
          printf '\n---\nChecked by upstream-watch before opening: validate, scrub-scan, sync-upstream --check, build --check.\n' >> upstream-report.md

      - name: Open or refresh the review pull request into develop
        if: steps.up.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "upstream-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add upstream.lock.json upstream plugin INDEX.md .claude-plugin
          git commit -m "Upstream changes $TODAY"
          git push -f origin "$BRANCH"
          OPEN=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --title "Upstream changes (updated $TODAY)" --body-file upstream-report.md
            echo "Refreshed pull request #$OPEN"
          else
            gh pr create --base develop --head "$BRANCH" --title "Upstream changes (updated $TODAY)" --body-file upstream-report.md
          fi
