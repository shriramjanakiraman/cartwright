name: overlay-ci
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  check:   # required status check name used by scripts/protect-branches.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shriramjanakiraman/cartwright
          path: .core
          token: ${{ secrets.CORE_REPO_TOKEN }}   # read-only token for the private core repo
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Project skills meet the standard (prefix, project field, description, no core clashes)
        run: node .core/scripts/validate.mjs --overlay .
      - name: Overlay plugin is current
        run: node .core/scripts/build-overlay.mjs . --check
      - name: No secrets, even in a private overlay
        run: node .core/scripts/scrub-scan.mjs --secrets-only $(git ls-files 'skills/*.md')
