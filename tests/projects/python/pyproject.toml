[project]
name = "sample-pricing"
version = "0.1.0"
description = "A made-up pricing service used by Cartwright's tests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",  # web framework
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
